analysis:
  experiments: ["beta1.1_CPC_ICs", "beta1.1_CPC_ICs_PND_TOPO", "beta1.1_FINAL"]
  variable: 'SST'
  period: 'all'
  n_members: 'all'

variables:
  ice: ["aice", "hi", "hs", "Tsfc", "albsni", "meltt", "meltb"]

parse:
  interpolate: 
    perform: True
    grid_files: ["${PWD}/pytools/grids/NH10km.nc", "${PWD}/pytools/grids/SH10km.nc"]

plot:
  maps: False
  line: True
  spread: True
  regions: ['global', 'nino34', 'tropics', 'equator', 'Arctic', 'Antarctic']

delete_files: False
